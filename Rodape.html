<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Importação da fonte pixel art */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

.arcade-footer {
  background-color: #0b0719; /* Fundo roxo bem escuro */
  color: #a099c4;
  font-family: 'Press Start 2P', cursive;
  padding: 40px 20px 20px;
  box-sizing: border-box;
}

.footer-container {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 30px;
}

/* Marca / Logo */
.footer-brand .logo {
  color: #79ded7; /* Ciano pixel */
  font-size: 24px;
  margin: 0 0 15px 0;
  letter-spacing: 2px;
}

.footer-brand .tagline {
  font-size: 10px;
  color: #8c83b3;
  line-height: 1.6;
}

/* Colunas de Navegação */
.footer-column h3 {
  color: #e685ca; /* Rosa pixel */
  font-size: 12px;
  margin-bottom: 15px;
}

.footer-column ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.footer-column li {
  margin-bottom: 10px;
}

.footer-column a {
  color: #8c83b3;
  text-decoration: none;
  font-size: 10px;
  transition: color 0.2s ease;
}

.footer-column a:hover {
  color: #ffffff;
}

/* Linha Divisória e Copyright */
.footer-bottom {
  max-width: 1100px;
  margin: 30px auto 0;
  padding-top: 20px;
  border-top: 1px solid #1c1538;
  text-align: center;
}

.footer-bottom p {
  font-size: 9px;
  color: #6b6294;
  margin: 0;
}

.footer-bottom .heart {
  color: #e685ca;
}
</style>
</head>
<body>

   <footer class="arcade-footer">
  <div class="footer-container">
    
    <div class="footer-brand">
      <h2 class="logo">Qmath</h2>
      <p class="tagline">Exercícios de Matemática</p>
    </div>

    <div class="footer-column">
      <h3>LINKS</h3>
      <ul>
        <li><a href="#">Jogos</a></li>
        <li><a href="#">Sobre</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </div>

    <div class="footer-column">
      <h3>CONECTE-SE</h3>
      <ul>
        <li><a href="https://www.instagram.com/terceirao._ds?igsh=OTVmN3J1ejhnNHd2">Instagram</a></li>
      </ul>
    </div>

  </div>

  <div class="footer-bottom">
    <p>© 2026 Qmath • Feito com <span class="heart">♥</span> </p>
  </div>
</footer>
</body>
</html>
